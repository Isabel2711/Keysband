<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HotelAdmin Pro</title>
    
    <!-- CDN Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CDN Sweet Alert -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Estilos personalizados modularizados -->
    <link rel="stylesheet" href="src/css/theme.css">
    <link rel="stylesheet" href="src/css/global.css">
    <link rel="stylesheet" href="src/css/login.css">
</head>
<body class="login-page">

    <!-- Botón para cambiar tema -->
    <button class="theme-toggle" id="btnTheme" title="Cambiar tema">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
    </button>

    <!-- Tarjeta de Login -->
    <div class="login-card">
        <!-- Encabezado -->
        <div class="login-header">
            <h2>
                <i class="fa-solid fa-hotel"></i> 
                HotelAdmin <span style="color: var(--accent-blue);">Pro</span>
            </h2>
            <p>Ingresa tus credenciales</p>
        </div>
        
        <!-- Formulario de Login -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="fa-solid fa-user"></i> Usuario
                </label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="email" 
                    placeholder="root" 
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Contraseña
                </label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Recordar contraseña</label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Scripts externos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Script de la aplicación (módular) -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
